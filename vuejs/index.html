<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
		<title>VueJS</title>
	</head>
	<body>
		<div id="container">
			<h1>VueJS</h1>
			<a href="https://vuejs.org/guide/introduction" target="_blank">VueJS Docs</a>
			<div id="app">
				<div class="card d-flex justify-content-center">
					<form>
						<div>
							<input class="form-control" type="text" id="name" name="name">
						</div>
						<div>
							<select class="form-select" name="planet">
								<option value="Mars">Mars</option>
								<option value="Venuše">Venuše</option>
							</select>
						</div>
						<div>
							<input class="form-control" type="number" id="days" name="days">
						</div>
						<div>
							<input class="form-input-check" type="checkbox" id="terms">
							<label class="form-check-label" for="terms">Souhlasím s podmínkami</label>
						</div>
						<button type="submit">Odeslat</button>
					</form>
				</div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
		<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

		<script>
			const { createApp, ref } = Vue;

			const app = createApp({
				data() {
					return {
						message: "Hello World!"
					}
				}
			});

			app.mount('#app');
		</script>
	</body>
</html>
